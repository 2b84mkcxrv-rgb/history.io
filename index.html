<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1219">
<title>测测你是历史人物中的谁</title>
<style>
:root{
  --bg:#0e1219; --bg2:#161c27;
  --gold:#e3c07a; --gold2:#c9963f; --gold-l:#f6e3b4;
  --red:#c0473c; --ink:#0a0d13;
  --txt:#f2ead9; --sub:#a9a394; --line:rgba(227,192,122,.22);
  --card:rgba(255,255,255,.045);
  --king:linear-gradient(135deg,#f0cf86,#c88935);
  --wise:linear-gradient(135deg,#8ec5d6,#4c7fa8);
  --poet:linear-gradient(135deg,#9ed2a8,#4f8f74);
  --hero:linear-gradient(135deg,#e8897c,#b23c35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
  color:var(--txt);
  background:radial-gradient(1200px 800px at 50% -10%,#1e2636 0%,var(--bg) 55%,var(--ink) 100%);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  overflow-x:hidden;
}
/* 星尘背景 */
#dust{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:26px 18px 40px;min-height:100dvh;display:flex;flex-direction:column}
.view{display:none;animation:fade .5s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 通用装饰 */
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold2);font-size:12px;letter-spacing:4px;opacity:.8}
.orn::before,.orn::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
.orn::after{background:linear-gradient(90deg,var(--gold2),transparent)}

/* 首页 */
.home{padding-top:26px;text-align:center}
.seal-hero{
  width:96px;height:96px;margin:0 auto 22px;border:3px solid var(--gold2);border-radius:14px;
  display:flex;align-items:center;justify-content:center;position:relative;transform:rotate(-4deg);
  background:linear-gradient(145deg,rgba(192,71,60,.22),rgba(227,192,122,.06));
  box-shadow:0 0 0 4px rgba(227,192,122,.09),0 14px 30px -12px rgba(0,0,0,.7)
}
.seal-hero span{font-family:"STKaiti","KaiTi","Noto Serif CJK SC",serif;font-size:56px;font-weight:700;color:var(--gold-l);line-height:1}
.seal-hero::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(227,192,122,.35);border-radius:9px}
h1{font-size:clamp(26px,7vw,38px);margin:0 0 12px;letter-spacing:2px;line-height:1.35;font-weight:800;
  background:linear-gradient(180deg,#fff8e9,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--sub);font-size:14px;line-height:1.9;margin:0 0 8px}
.hint{color:var(--gold2);font-size:12px;letter-spacing:1px;margin:18px 0 26px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:17px;border:none;border-radius:14px;cursor:pointer;font-size:17px;font-weight:800;letter-spacing:2px;
  color:#1a1206;background:linear-gradient(135deg,var(--gold-l),var(--gold2));
  box-shadow:0 14px 30px -12px rgba(201,150,63,.75);transition:transform .18s,box-shadow .18s
}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(227,192,122,.08);color:var(--gold);border:1px solid var(--line);box-shadow:none;font-weight:600}
.people-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:20px 0 6px}
.pchip{border:1px solid var(--line);border-radius:12px;padding:9px 2px;background:var(--card);font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:5px}
.pchip i{font-style:normal;font-family:"STKaiti","KaiTi",serif;font-size:16px;color:var(--gold)}

/* 答题 */
.quiz-top{margin:6px 0 26px}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px;letter-spacing:1px}
.qmeta b{color:var(--gold);font-size:15px}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--gold2),var(--gold-l));transition:width .45s cubic-bezier(.2,.8,.3,1)}
.qtext{font-size:clamp(19px,5vw,24px);font-weight:700;line-height:1.6;margin:30px 0 24px;letter-spacing:.5px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  display:flex;align-items:flex-start;gap:14px;padding:17px 16px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(227,192,122,.18);background:var(--card);transition:transform .16s,border-color .16s,background .16s;
  font-size:15px;line-height:1.55;color:var(--txt)
}
.opt:active{transform:scale(.99)}
@media(hover:hover){.opt:hover{border-color:var(--gold);background:rgba(227,192,122,.09)}}
.opt .k{flex:0 0 30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:var(--gold);background:rgba(227,192,122,.1);border:1px solid var(--line)}
.opt.sel{border-color:var(--gold);background:rgba(227,192,122,.14)}

/* 结果 */
.res-head{text-align:center;padding:8px 0 4px}
.seal-big{
  width:112px;height:112px;margin:6px auto 18px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  position:relative;transform:rotate(-3deg);border:4px solid var(--rc,var(--gold2));
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(0,0,0,.25));
  box-shadow:0 0 0 5px rgba(227,192,122,.08),0 18px 38px -14px rgba(0,0,0,.8);
  animation:stamp .6s cubic-bezier(.2,1.5,.4,1)
}
@keyframes stamp{from{transform:scale(1.5) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.seal-big .nm{font-family:"STKaiti","KaiTi","Noto Serif CJK SC",serif;font-size:31px;font-weight:700;line-height:1.15;color:var(--gold-l);text-align:center;padding:4px;letter-spacing:1px}
.seal-big::after{content:"";position:absolute;inset:6px;border:1px dashed var(--rc,var(--gold2));border-radius:10px;opacity:.6}
.r-label{font-size:12px;letter-spacing:5px;color:var(--gold2);margin-bottom:8px}
.r-name{font-size:clamp(28px,8vw,40px);font-weight:800;margin:0;letter-spacing:2px}
.r-id{font-size:13px;color:var(--sub);margin:8px 0 0;letter-spacing:1px}

.score-card{display:flex;align-items:center;gap:20px;margin:26px 0 18px;padding:20px;border-radius:18px;
  border:1px solid var(--line);background:linear-gradient(135deg,rgba(227,192,122,.09),rgba(255,255,255,.02))}
.ring{position:relative;flex:0 0 128px;width:128px;height:128px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:rgba(255,255,255,.08)}
.ring .val{stroke:url(#gg);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.ring .num b{font-size:35px;color:var(--gold-l);line-height:1}
.ring .num small{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:1px}
.score-txt h3{margin:0 0 10px;font-size:16px;color:var(--gold)}
.score-txt p{margin:0;font-size:13px;color:var(--sub);line-height:1.75}

.sec{margin:22px 0}
.sec-t{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:var(--gold);margin-bottom:12px;letter-spacing:1px}
.sec-t::before{content:"";width:4px;height:15px;border-radius:3px;background:var(--gold2)}
.desc{font-size:14px;line-height:2;color:#ded5c4;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 17px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font-size:12px;color:var(--gold-l);border:1px solid var(--line);background:rgba(227,192,122,.07);padding:6px 12px;border-radius:20px}
.moment{font-size:13px;line-height:1.9;color:var(--sub);border-left:2px solid var(--gold2);padding-left:14px}
.quote{font-size:13px;line-height:1.9;color:#c9bfa9;font-style:italic;text-align:center;padding:6px 0}
.top3{display:flex;flex-direction:column;gap:11px}
.t3row{display:flex;align-items:center;gap:11px;font-size:13px}
.t3row .n{width:64px;color:var(--txt);flex:0 0 64px}
.t3row .track{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.t3row .track i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--gold2),var(--gold-l));transition:width 1s .2s}
.t3row .p{width:38px;text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-direction:column;gap:11px;margin-top:26px}
.foot-note{text-align:center;font-size:11px;color:#6f6a5f;margin-top:24px;line-height:1.8;letter-spacing:.5px}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:rgba(20,24,32,.96);
  border:1px solid var(--line);color:var(--gold-l);padding:12px 22px;border-radius:30px;font-size:13px;
  opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:480px){
  .wrap{padding:20px 15px 34px}
  .seal-hero{width:84px;height:84px}.seal-hero span{font-size:48px}
  .people-grid{gap:5px}.pchip{font-size:9px;padding:8px 1px}.pchip i{font-size:14px}
  .score-card{gap:13px;padding:15px}.ring{flex-basis:108px;width:108px;height:108px}
  .ring .num b{font-size:29px}
  .seal-big{width:98px;height:98px}.seal-big .nm{font-size:27px}
}
@media(max-width:360px){.people-grid{grid-template-columns:repeat(4,1fr)}.opt{padding:15px 12px;font-size:14px}}
</style>
</head>
<body>
<canvas id="dust"></canvas>
<div class="wrap">

  <!-- 首页 -->
  <section class="view home on" id="v-home">
    <div class="seal-hero"><span>史</span></div>
    <div class="orn">上 下 五 千 年</div>
    <h1 style="margin-top:18px">测测你是<br>历史人物中的谁</h1>
    <p class="subtitle">18 道趣味情境题<br>穿越千年，解锁属于你的历史人格</p>
    <p class="hint">凭第一直觉作答 · 约 5 分钟</p>
    <button class="btn" onclick="start()">开始穿越 &nbsp;→</button>
    <div class="people-grid" id="pgrid"></div>
    <div class="foot-note">趣味测试 · 仅供娱乐<br>答案无好坏，只为遇见另一个自己</div>
  </section>

  <!-- 答题 -->
  <section class="view" id="v-quiz">
    <div class="quiz-top">
      <div class="qmeta"><span>穿越进度</span><span><b id="qnow">1</b> / <span id="qall">12</span></span></div>
      <div class="bar"><i id="barfill"></i></div>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="foot-note">凭直觉，选最像你的那一个</div>
  </section>

  <!-- 结果 -->
  <section class="view" id="v-result">
    <div class="res-head">
      <div class="orn">时 空 之 镜</div>
      <div class="seal-big" id="rseal"><div class="nm" id="rsealname"></div></div>
      <div class="r-label">你是</div>
      <h2 class="r-name" id="rname"></h2>
      <p class="r-id" id="rid"></p>
    </div>

    <div class="score-card">
      <div class="ring">
        <svg width="128" height="128" viewBox="0 0 128 128">
          <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6e3b4"/><stop offset="1" stop-color="#c9963f"/>
          </linearGradient></defs>
          <circle class="trk" cx="64" cy="64" r="54"/>
          <circle class="val" id="ringval" cx="64" cy="64" r="54"/>
        </svg>
        <div class="num"><b id="rpct">0</b><small>契合度 %</small></div>
      </div>
      <div class="score-txt">
        <h3 id="rverdict"></h3>
        <p id="rwhy"></p>
      </div>
    </div>

    <div class="sec">
      <div class="sec-t">人格画像</div>
      <div class="desc" id="rdesc"></div>
      <div class="tags" id="rtags"></div>
    </div>

    <div class="sec">
      <div class="sec-t">高光时刻</div>
      <div class="moment" id="rmoment"></div>
    </div>

    <div class="sec">
      <div class="sec-t">穿越寄语</div>
      <div class="quote" id="rquote"></div>
    </div>

    <div class="sec">
      <div class="sec-t">与你最接近的三位</div>
      <div class="top3" id="rtop3"></div>
    </div>

    <div class="btns">
      <button class="btn" onclick="makeCard()">生成人物卡片</button>
      <button class="btn ghost" onclick="restart()">再测一次</button>
    </div>
    <div class="foot-note">卡片将保存到当前设备的「下载」文件夹<br>趣味测试 · 仅供娱乐</div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 历史人物库 ============ */
const P={
  qinshihuang:{name:'秦始皇',short:'始皇',id:'秦 · 始皇帝 ｜ 千古一帝',cls:'王',col:'#e8b657',
    tags:['决断','格局','秩序','铁腕'],
    desc:'你天生带着一种"我来定规则"的气场。面对复杂局面，你不会被情绪裹挟，而是迅速抓住最关键的那条主线，然后一推到底。你相信秩序和效率，讨厌无休止的扯皮；别人还在权衡利弊时，你已经把蓝图铺开了。你身上有一种孤独的清醒——站得越高，越习惯一个人做决定。',
    moment:'公元前221年，横扫六合、统一六国，建立中国第一个中央集权帝国。书同文、车同轨、统一度量衡，奠定此后两千年的格局。',
    quote:'"大格局的人，从不纠结于一步的得失。"',
    verdict:'天命属·开创之主',why:'你总在局面最混乱时挺身而出，用决断力把一切重新排序。'},
  liubang:{name:'刘邦',short:'高祖',id:'汉 · 高祖 ｜ 草根帝王',cls:'王',col:'#e8b657',
    tags:['务实','豁达','用人','接地气'],
    desc:'你身上有种天然的亲和力，能让三教九流的人都愿意跟你共事。你从不高估自己的全能，却极懂把对的人放在对的位置上——这是最高级的智慧。你务实、能屈能伸，脸皮厚一点、心胸宽一点，反而让你在逆境里活得比谁都从容。人们常说你"没架子"，但这恰恰是你最锋利的武器。',
    moment:'从沛县一介亭长起兵，斩白蛇、约法三章，知人善任，最终击败项羽建立大汉王朝。',
    quote:'"最快的路，往往不是最体面的那条。"',
    verdict:'人心属·草根英雄',why:'你不是最强的那个，却是最能聚起人心的那个。'},
  lishimin:{name:'李世民',short:'世民',id:'唐 · 太宗 ｜ 天可汗',cls:'王',col:'#e8b657',
    tags:['雄略','纳谏','格局','盛世'],
    desc:'你既有开创的魄力，又有守成的智慧——这比单纯能打更难。你清楚一个人再强也有盲区，所以真心愿意听逆耳忠言，甚至把敢顶撞你的人留在身边。你眼光放在整个时代，而非一城一池的得失。跟你共事的人会觉得：只要方向对，就放心跟着干。你活成了一个盛世的底色。',
    moment:'玄武门之变后即位，虚心纳谏、任用贤能，开创"贞观之治"，被各族尊奉为"天可汗"。',
    quote:'"以铜为镜，可以正衣冠；以古为镜，可以知兴替。"',
    verdict:'盛世属·天可汗',why:'你能听进逆耳忠言，把一个时代托举起来。'},
  wuzetian:{name:'武则天',short:'武皇',id:'唐（周）· 女皇 ｜ 破局者',cls:'王',col:'#e8b657',
    tags:['魄力','破局','掌控','野心'],
    desc:'你从不被"本来应该"四个字困住。别人眼中的天花板，在你看来只是起点。你有极强的掌控欲，但这份掌控欲背后是清醒的目标感——知道自己要什么，也知道为此要付出什么。你善于在规则之内蓄力，在关键时刻一击破局。你的存在本身，就是对偏见最有力的回击。',
    moment:'从才人一步步走上皇位，成为中国历史上唯一被正史承认的女皇帝，开创"政启开元，治宏贞观"。',
    quote:'"命运给的限制，我偏要亲手改写。"',
    verdict:'破局属·无双女皇',why:'你敢于撕掉别人贴给你的标签，用结果重新定义自己。'},
  lvhou:{name:'吕雉',short:'吕后',id:'西汉 · 高皇后 ｜ 临朝称制',cls:'王',col:'#e8b657',
    tags:['隐忍','铁腕','权谋','格局'],
    desc:'你懂得把情绪藏起来，把账记在心里。表面上不争不抢，实则每一步都在为最终的目标铺路。你有极强的耐心，能在漫长的隐忍中等待那个唯一的时机；一旦出手，便冷静得让人心惊。你相信权力不是抢来的，是熬出来的——熬得住的人，才配站到最后。',
    moment:'刘邦死后临朝称制十六年，稳定汉初政局，推行休养生息，为"文景之治"奠定基础。',
    quote:'"忍得住一时，才守得住一世。"',
    verdict:'隐忍属·临朝称制',why:'你把委屈咽下去，把主动权攥在手里，用时间换来了天下。'},
  xuanhou:{name:'芈月',short:'宣后',id:'战国 · 秦宣太后 ｜ 铁血柔情',cls:'王',col:'#e8b657',
    tags:['果敢','手腕','圆融','魄力'],
    desc:'你是那种能把柔情与狠辣集于一身的人。你懂得示弱，也懂得在关键时刻露出锋芒；你善于借势，把每一段关系都变成自己的筹码。你不被名分束缚，只在乎实实在在的结果。别人以为你靠的是运气，其实你只是在没人看见的地方，把每一步都算到了极致。',
    moment:'以秦惠文王妃身份，凭借过人政治手腕稳定秦国，成为中国历史上第一位称"太后"的女性，主政三十余年。',
    quote:'"能笑着解决的，从不需要哭。"',
    verdict:'手腕属·宣太后',why:'你把身段放得够低，所以能站得比谁都高。'},
  zhugeliang:{name:'诸葛亮',short:'孔明',id:'三国 · 蜀汉丞相 ｜ 卧龙',cls:'智',col:'#7db8d0',
    tags:['智慧','忠诚','谨慎','周全'],
    desc:'你是那种"把一切想明白再出手"的人。周全、克制、责任心强，交到你手上的事，别人总能放心。你习惯在脑子里预演所有可能性，所以看起来总是从容不迫。你并不追求光芒万丈，而是相信细水长流的坚持。你心里有一份近乎执拗的忠诚——对信念，也对重要的人。',
    moment:'未出茅庐而定三分天下，辅佐刘备建立蜀汉，五次北伐，鞠躬尽瘁，死而后已。',
    quote:'"宁静致远，把每一步都走在前面。"',
    verdict:'谋略属·卧龙之才',why:'你用周全与远见，把不确定的世界一点点变成可控。'},
  caocao:{name:'曹操',short:'孟德',id:'三国 · 魏武帝 ｜ 乱世枭雄',cls:'智',col:'#7db8d0',
    tags:['雄才','多谋','复杂','诗性'],
    desc:'你是矛盾的集合体：既务实到骨子里，又有诗意的情怀；既能杀伐决断，又会为一句诗热泪盈眶。你看透了人性的幽暗，却并不因此愤世嫉俗，反而更懂得利用规则、成就事情。你讨厌平庸，渴望在乱世中留下印记。别人说你复杂，其实你只是比大多数人活得用力。',
    moment:'挟天子以令诸侯，统一北方，唯才是举；同时是建安文学的代表，"对酒当歌，人生几何"。',
    quote:'"宁教我负天下人，也不教天下人负我——但我会记得每一个帮我的人。"',
    verdict:'枭雄属·治世之能臣',why:'你勘破世道却依然入世，把才华与手腕用到极致。'},
  kongzi:{name:'孔子',short:'孔丘',id:'春秋 · 至圣先师 ｜ 儒家创始人',cls:'智',col:'#7db8d0',
    tags:['仁爱','教化','中庸','坚守'],
    desc:'你相信道理的力量，也相信人可以变得更好。你身上有那种"明知不可为而为之"的执着，不因世道浑浊就放弃自己的标准。你善于循循善诱，能把复杂的事讲得让人点头。你不追求锋利的胜利，而追求长久的影响——你更愿意成为别人生命里那个点灯的人。',
    moment:'周游列国十四年，删诗书、定礼乐、修春秋，开创儒家学派，思想影响中国两千余年。',
    quote:'"三人行，必有我师焉。"',
    verdict:'仁道属·至圣先师',why:'你用道理与坚守，活成了别人愿意追随的光。'},
  laozi:{name:'老子',short:'李耳',id:'春秋 · 道家始祖 ｜ 道德经',cls:'智',col:'#7db8d0',
    tags:['无为','通透','守静','大智慧'],
    desc:'你是人群里最通透的那一个。别人忙着争抢，你却懂得"不争"才是最高明的争。你看得见事物盛极而衰的规律，所以不执着于一时的强弱。你说话不多，却每句都值得琢磨。你的强大是水一样的——柔软，却能穿透最坚硬的石头。跟在你身边，人会不自觉地慢下来、静下来。',
    moment:'著《道德经》五千言，提出"无为而治""上善若水"，被尊为道家始祖。',
    quote:'"上善若水，水善利万物而不争。"',
    verdict:'大道属·道家始祖',why:'你用"不争"，赢过了所有急着争先的人。'},
  shangguanwaner:{name:'上官婉儿',short:'婉儿',id:'唐 · 女官 ｜ 巾帼宰相',cls:'智',col:'#7db8d0',
    tags:['才情','圆融','机敏','权衡'],
    desc:'你是人群中最会看眼色、也最有真才实学的那一个。你懂得在夹缝中游走，把危机变成机会；你文采斐然，却从不恃才傲物。你深知锋芒太露会招祸，所以总把聪明藏在温和的外表下。你在复杂的局面里保持清醒，用分寸感护住自己，也护住在乎的人。',
    moment:'从罪臣遗孤到位高权重的女官，掌管诏命、主持文坛，在武则天与唐中宗时期均游刃有余，被誉为"巾帼宰相"。',
    quote:'"锋芒要藏，本事要硬。"',
    verdict:'权衡属·巾帼宰相',why:'你用分寸感和真本事，在风口浪尖站稳了脚跟。'},
  banZhao:{name:'班昭',short:'班昭',id:'东汉 · 史学家 ｜ 一代才媛',cls:'智',col:'#7db8d0',
    tags:['渊博','严谨','坚韧','传承'],
    desc:'你是安静而强大的那类人。你相信文字与思想的力量，愿意为一件长远的事默默坚守。你治学严谨、条理清晰，能把纷乱的东西梳理得井井有条。你从不张扬，却在不知不觉中成为别人的依靠与导师。你的强大不在于一时的锋芒，而在于经年累月沉淀下来的学识与定力。',
    moment:'续成兄长班固未竟的《汉书》，成为中国第一位女史学家；晚年教授后宫女子，被尊称为"曹大家"。',
    quote:'"慢一点没关系，稳一点才走得远。"',
    verdict:'传承属·一代才媛',why:'你用一生的沉静坚守，把名字写进了历史。'},
  libai:{name:'李白',short:'太白',id:'唐 · 诗仙 ｜ 谪仙人',cls:'诗',col:'#8fd0a6',
    tags:['浪漫','自由','豪放','天才'],
    desc:'你活得像一阵风，灵感与热情是你最大的天赋。规则、束缚、别人的期待，对你来说都是可以笑着绕开的东西。你需要表达，需要舞台，需要那种"天生我材必有用"的痛快。你的情绪来得汹涌、去得也快，但正是这份不设防，让你总能点燃身边的人。世界在你眼里，是一场盛大的漫游。',
    moment:'斗酒诗百篇，天子呼来不上船；被贺知章惊呼为"谪仙人"，诗名照耀千古。',
    quote:'"人生得意须尽欢，莫使金樽空对月。"',
    verdict:'浪漫属·天纵诗仙',why:'你不愿被定义，用才华和自由把日子活成了传奇。'},
  sushi:{name:'苏轼',short:'东坡',id:'北宋 · 文豪 ｜ 东坡居士',cls:'诗',col:'#8fd0a6',
    tags:['豁达','乐观','多才','随缘'],
    desc:'你身上有一种罕见的能力：把一手烂牌打得有滋有味。被贬到黄州，你能研究红烧肉；流落岭南，你能爱上荔枝。你通透、幽默、兴趣广泛，琴棋书画诗酒茶样样来。你并非没有痛苦，只是懂得与痛苦共处，然后在某个清晨写出一句"一蓑烟雨任平生"。跟你相处的人，总觉得日子没那么难了。',
    moment:'乌台诗案后被贬黄州，写下前后《赤壁赋》《念奴娇·赤壁怀古》，把贬谪生涯过成千古风流。',
    quote:'"竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。"',
    verdict:'旷达属·人间清欢',why:'你把每次跌落都变成了创作，把苦日子过成了诗。'},
  quyuan:{name:'屈原',short:'屈原',id:'战国 · 楚辞代表 ｜ 爱国诗人',cls:'诗',col:'#8fd0a6',
    tags:['孤高','爱国','浪漫','坚守'],
    desc:'你情感浓烈、理想纯粹，是那种"举世皆浊我独清"的人。你对认定的信念近乎偏执，宁可孤独到底，也不肯弯下腰去迎合。你把满腔热血都写进了诗里，香草美人、上下求索，字字都是真心。这种纯粹的深情让你活得痛苦又动人——你不是不懂圆滑，只是不屑于此。',
    moment:'创作《离骚》《九歌》等不朽篇章，开创楚辞文学，最终投汨罗江以身殉国。',
    quote:'"路漫漫其修远兮，吾将上下而求索。"',
    verdict:'求索属·楚辞之魂',why:'你宁愿孤独，也不肯向世俗低下头。'},
  liqingzhao:{name:'李清照',short:'清照',id:'宋 · 词人 ｜ 千古第一才女',cls:'诗',col:'#8fd0a6',
    tags:['敏感','才情','真性情','坚韧'],
    desc:'你情感细腻、感知力极强，一片落叶、一场细雨都能在你心里激起回响。你把这份敏感化成了才华，用文字把转瞬即逝的心绪凝固成永恒。你爱得真切，痛得也真切，从不为掩饰自己的情绪而羞耻。哪怕命运把你推入颠沛流离，你依然能守住内心那点清高与体面。',
    moment:'婉约词派代表，号"易安居士"，写下《如梦令》《声声慢》等千古名篇；南渡后仍以词抒怀，被誉"千古第一才女"。',
    quote:'"知否，知否，应是绿肥红瘦。"',
    verdict:'才情属·易安居士',why:'你把敏感活成了天赋，让每一份情绪都成了传世的句子。'},
  caiwenji:{name:'蔡文姬',short:'文姬',id:'东汉 · 才女 ｜ 胡笳悲歌',cls:'诗',col:'#8fd0a6',
    tags:['多舛','才情','思念','坚韧'],
    desc:'你经历过命运最粗暴的翻覆，却始终把才华与尊严守在心底。你懂得离别的重量，也懂得在绝境里为自己找一条生路。你的文字里有化不开的乡愁，也有抹不掉的坚韧。你不抱怨命运，只把苦难酿成作品——这是你独有的、把失去变成永恒的本事。',
    moment:'博学多才，精通音律，战乱中被掳至匈奴十二年，后被曹操赎回，作《悲愤诗》与《胡笳十八拍》，感天动地。',
    quote:'"悲到极处，也能唱成歌。"',
    verdict:'坚韧属·胡笳悲歌',why:'你把苦难酿成了艺术，让伤痕开出了花。'},
  zhuowenjun:{name:'卓文君',short:'文君',id:'西汉 · 才女 ｜ 私奔传佳话',cls:'诗',col:'#8fd0a6',
    tags:['敢爱','果敢','才情','洒脱'],
    desc:'你是那种敢为真心对抗全世界的人。你不受礼教和眼光的束缚，认定了就勇敢地走下去。你既有浪漫的勇气，也有现实的清醒——私奔之后当垆卖酒，一样能把日子过得有声有色。你用自己的选择证明：一个人的人生，可以由自己定义。',
    moment:'新寡之夜与司马相如私奔，当垆卖酒不惧世俗非议；后相如变心，她以《白头吟》"愿得一心人，白首不相离"挽回，传为佳话。',
    quote:'"愿得一心人，白首不相离。"',
    verdict:'敢爱属·当垆才女',why:'你敢爱敢恨，用真性情把人生过成了传奇。'},
  guanyu:{name:'关羽',short:'云长',id:'三国 · 蜀汉名将 ｜ 武圣',cls:'侠',col:'#e88a7e',
    tags:['忠义','刚正','勇武','骄傲'],
    desc:'你把"义气"两个字看得比什么都重。答应朋友的事，上刀山也要做到；认定的道理，谁说都不改。你光明磊落，恩怨分明，是一种让人安心又让人敬畏的存在。你也有骄傲的一面——那是因为你不屑于用圆滑换取好处。你相信，人这一生，总有些东西要比利益更值得守护。',
    moment:'桃园三结义，过五关斩六将，水淹七军威震华夏，被后世尊为"武圣"。',
    quote:'"玉可碎而不可改其白，竹可焚而不可毁其节。"',
    verdict:'忠义属·千古武圣',why:'你用一生诠释了什么是"值得托付后背的人"。'},
  yuefei:{name:'岳飞',short:'鹏举',id:'南宋 · 抗金名将 ｜ 民族英雄',cls:'侠',col:'#e88a7e',
    tags:['忠烈','自律','理想','刚直'],
    desc:'你心里有一团不会熄灭的火，那是对理想的执拗坚守。你极度自律，对自己比对别人更狠；你相信正义终会到来，哪怕要为此等待很久。你不太懂得妥协的圆滑，因为在你心里，有些底线就是不能交易。这种纯粹让你显得有些悲壮，但也正是它，让你在漫长的岁月里始终闪闪发光。',
    moment:'背刺"精忠报国"，率岳家军屡破金兵，写下气壮山河的《满江红》。',
    quote:'"三十功名尘与土，八千里路云和月。"',
    verdict:'精忠属·理想战士',why:'你宁愿站着输，也不跪着赢，理想是你不灭的火。'},
  huamulan:{name:'花木兰',short:'木兰',id:'南北朝 · 巾帼英雄 ｜ 替父从军',cls:'侠',col:'#e88a7e',
    tags:['勇敢','担当','突破','独立'],
    desc:'你是那种"别人说不行，你偏要试试"的人。你独立、能扛事，面对不公平的期待，你不会抱怨，而是直接用行动打破它。你心里有柔软的地方——替父从军的初衷是孝，支撑十二年征战的是责任。你证明了勇气没有性别，限制往往是自己设的。你活成了很多人想成为却不敢成为的样子。',
    moment:'女扮男装替父从军，征战十二年立下战功，"将军百战死，壮士十年归"。',
    quote:'"谁说女子不如男？"',
    verdict:'无畏属·巾帼英雄',why:'你用行动撕掉标签，证明限制只存在于想象之中。'},
  muguYing:{name:'穆桂英',short:'桂英',id:'北宋 · 女将 ｜ 挂帅出征',cls:'侠',col:'#e88a7e',
    tags:['英姿','果敢','担当','破局'],
    desc:'你是天生的大场面选手，越到危急关头越冷静、越有担当。你不被偏见困住，反而用实力把所有质疑一一击碎。你武艺超群，更有一颗统帅全局的心——既能冲锋陷阵，也能运筹帷幄。你活成了很多人想成为、却不敢成为的样子。',
    moment:'杨家将中的女中豪杰，大破天门阵，五十余岁仍挂帅出征，忠勇冠绝一时。',
    quote:'"谁说女子不如男？看我挂帅出征。"',
    verdict:'英姿属·挂帅女将',why:'你把偏见踩在脚下，用实力赢得满堂喝彩。'},
  fanlihua:{name:'樊梨花',short:'梨花',id:'唐 · 女将 ｜ 寒江关传奇',cls:'侠',col:'#e88a7e',
    tags:['勇烈','果断','独立','传奇'],
    desc:'你是敢作敢当、快意恩仇的那类人。你的人生从不按别人的剧本走——该出手时绝不犹豫，该决断时从不含糊。你有极强的主见，敢于打破常规的束缚，为自己的选择承担一切后果。你的身上有一股江湖儿女的爽利，活得坦荡又痛快。',
    moment:'唐代传奇女将，武艺高强、足智多谋，与薛丁山几经波折终成眷属，挂帅平定西凉，被后世传颂。',
    quote:'"我命由我，不由旁人解说。"',
    verdict:'勇烈属·寒江女将',why:'你敢爱敢恨敢担当，把人生过得痛快淋漓。'},
  fuhao:{name:'妇好',short:'妇好',id:'商 · 王后女将 ｜ 巾帼战神',cls:'侠',col:'#e88a7e',
    tags:['勇武','统帅','尊贵','传奇'],
    desc:'你兼具温柔与力量，既能执掌祭祀、体贴入微，也能披甲上阵、统领千军。你身上有一种天然的威严，让人不由自主地信服与追随。你不因身份而设限，也不因赞美而迷失——你清楚自己是谁，也清楚自己要什么。你是有史可证的第一位女将军，活成了绝对的传奇。',
    moment:'商王武丁之妻，中国历史上有文字记载的第一位女将军，曾统兵万余出征，战功赫赫，死后享"冥婚"殊荣。',
    quote:'"温柔与锋芒，我都可以拥有。"',
    verdict:'传奇属·巾帼战神',why:'你柔韧兼具，把温柔与强大活成了同一种底色。'}
};

 {q:'面对一个几乎不可能完成的任务，你会？',o:[

 {q:'如果世界明天就消失，你最后悔没做的是？',o:[

/* ============ 逻辑 ============ */
const $=id=>document.getElementById(id);
let ans=[], cur=0, resultKey=null;
const keys=Object.keys(P);

function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}

// 首页人物 chips
(function(){
  const g=$('pgrid');
  keys.forEach(k=>{const d=document.createElement('div');d.className='pchip';
    d.innerHTML='<i>'+P[k].short+'</i>'+P[k].name;g.appendChild(d)});
})();

// 星尘
(function(){
  const c=$('dust'),x=c.getContext('2d');let W,H,pts=[];
  function rs(){W=c.width=innerWidth;H=c.height=innerHeight;pts=Array.from({length:Math.min(90,Math.floor(W*H/16000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random(),v:Math.random()*.012+.004}))}
  rs();addEventListener('resize',rs);
  function loop(){x.clearRect(0,0,W,H);for(const p of pts){p.a+=p.v;if(p.a>1||p.a<.1)p.v*=-1;
    x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(227,192,122,'+(p.a*.55)+')';x.fill()}
    requestAnimationFrame(loop)}loop();
})();

function start(){ans=[];cur=0;show('v-quiz');render()}
function render(){
  const q=Q[cur];
  $('qnow').textContent=cur+1;$('qall').textContent=Q.length;
  $('barfill').style.width=((cur)/Q.length*100)+'%';
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  q.o.forEach((o,i)=>{
    const d=document.createElement('div');d.className='opt';
    d.innerHTML='<span class="k">'+'ABCD'[i]+'</span><span>'+o.t+'</span>';
    d.onclick=()=>pick(i);box.appendChild(d)
  });
}
function pick(i){
  ans[cur]=i;
  document.querySelectorAll('.opt').forEach((e,j)=>e.classList.toggle('sel',j===i));
  $('barfill').style.width=((cur+1)/Q.length*100)+'%';
  setTimeout(()=>{cur++;if(cur<Q.length)render();else finish()},280)
}
function finish(){
  const sc={};keys.forEach(k=>sc[k]=0);
  ans.forEach((oi,qi)=>{const s=Q[qi].o[oi].s;for(const k in s)sc[k]+=s[k]});
  // 理论满分（用于契合度）
  const mx={};keys.forEach(k=>mx[k]=Q.reduce((a,q)=>a+Math.max(...q.o.map(o=>o.s[k]||0)),0));
  const rank=keys.slice().sort((a,b)=>sc[b]-sc[a]);
  resultKey=rank[0];
  const p=rank.map((k,i)=>({k,v:sc[k],pct:Math.round(sc[k]/mx[k]*100)}));
  // 保序修正，避免并列/倒挂
  for(let i=1;i<p.length;i++)p[i].pct=Math.min(p[i].pct,p[i-1].pct-2);
  const top=p[0], person=P[resultKey];

  $('rseal').style.setProperty('--rc',person.col);
  $('rsealname').textContent=person.short;
  $('rname').textContent=person.name;
  $('rid').textContent=person.id;
  $('rverdict').textContent=person.verdict;
  $('rwhy').textContent=person.why;
  $('rdesc').textContent=person.desc;
  $('rtags').innerHTML=person.tags.map(t=>'<span class="tag"># '+t+'</span>').join('');
  $('rmoment').textContent=person.moment;
  $('rquote').textContent=person.quote;

  show('v-result');
  // 动画
  $('ringval').style.strokeDashoffset=(339.3*(1-top.pct/100)).toFixed(1);
  let n=0;const timer=setInterval(()=>{n+=Math.ceil(top.pct/22);if(n>=top.pct){n=top.pct;clearInterval(timer)}$('rpct').textContent=n},45);
  $('rtop3').innerHTML=p.slice(0,3).map((it,i)=>
    '<div class="t3row"><span class="n">'+(i+1)+'. '+P[it.k].name+'</span>'+
    '<span class="track"><i data-w="'+Math.max(8,it.pct)+'"></i></span>'+
    '<span class="p">'+it.pct+'%</span></div>').join('');
  setTimeout(()=>document.querySelectorAll('#rtop3 .track i').forEach(e=>e.style.width=e.dataset.w+'%'),120);
}
function restart(){show('v-home')}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}

/* ============ 生成人物卡片 ============ */
function makeCard(){
  if(!resultKey)return;
  const p=P[resultKey],W=1080,H=1440,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a2231');g.addColorStop(1,'#0a0d14');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // 圆环装饰
  x.strokeStyle='rgba(227,192,122,.07)';x.lineWidth=2;
  for(let r=140;r<760;r+=62){x.beginPath();x.arc(W/2,H/2,r,0,7);x.stroke()}
  x.textAlign='center';
  x.fillStyle='#c9963f';x.font='600 30px sans-serif';x.fillText('时 空 之 镜 · 历 史 人 格 测 试',W/2,96);
  // 印章
  const side=260,sx=W/2-side/2,sy=190;
  x.save();x.translate(W/2,sy+side/2);x.rotate(-3*Math.PI/180);x.translate(-W/2,-sy-side/2);
  x.strokeStyle=p.col;x.lineWidth=7;x.strokeRect(sx,sy,side,side);
  x.strokeStyle='rgba(227,192,122,.4)';x.lineWidth=2;x.strokeRect(sx+16,sy+16,side-32,side-32);
  x.fillStyle='#f6e3b4';x.font='bold 96px "KaiTi","STKaiti",serif';x.fillText(p.short,W/2,sy+side/2+34);
  x.restore();
  // 姓名 + 身份
  x.fillStyle='#f6e3b4';x.font='800 76px sans-serif';x.fillText(p.name,W/2,560);
  x.fillStyle='#a9a394';x.font='30px sans-serif';x.fillText(p.id,W/2,616);
  // 契合度
  x.fillStyle='#e3c07a';x.font='700 46px sans-serif';x.fillText('契合度 '+document.getElementById('rpct').textContent+'%',W/2,706);
  // 画像摘要（截取前 58 字分行）
  x.fillStyle='#ded5c4';x.font='30px sans-serif';
  wrapText(x,p.desc.slice(0,58)+'…',W/2,790,W-150,50);
  // 标签
  x.fillStyle='#e3c07a';x.font='600 28px sans-serif';x.fillText(p.tags.map(t=>'# '+t).join('   '),W/2,1180);
  // 落款
  x.fillStyle='#6f6a5f';x.font='24px sans-serif';x.fillText('测测你是历史人物中的谁',W/2,H-70);

  const a=document.createElement('a');
  a.download='历史人物卡片_'+p.name+'.png';a.href=c.toDataURL('image/png');a.click();
  toast('人物卡片已保存 ✓');
}
function wrapText(ctx,text,cx,y,maxW,lh){
  const chars=text.split('');let line='',yy=y;
  for(const ch of chars){if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,cx,yy);line=ch;yy+=lh}else line+=ch}
  if(line)ctx.fillText(line,cx,yy)
}
